<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f0e8" />
<title>猫手册 · PawBook</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon.svg" />
<style>
:root{
  --bg:#f6f0e8; --card:#fffdfa; --ink:#2c2620; --muted:#8b8177;
  --line:#e9e0d4; --brand:#d97a4a; --brand-soft:#f7e3d5;
  --ok:#4f8a5b; --warn:#c98a1e; --late:#c0503f; --tab:#fffdfa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{padding:18px 18px 10px;display:flex;align-items:baseline;gap:10px;max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0;letter-spacing:.5px}
.sub{font-size:12px;color:var(--muted)}
main{padding:0 14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;
  box-shadow:0 1px 0 rgba(0,0,0,.02)}
.row{display:flex;gap:12px;align-items:center}
.cat-photo{width:56px;height:56px;border-radius:14px;object-fit:cover;background:var(--brand-soft);flex:0 0 auto}
.cat-photo.empty{display:flex;align-items:center;justify-content:center;font-size:24px}
.name{font-size:16px;font-weight:600}
.meta{font-size:12px;color:var(--muted);margin-top:3px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin:2px 6px 2px 0}
.b-ok{background:#e6f0e6;color:var(--ok)}
.b-warn{background:#fbf0d8;color:var(--warn)}
.b-late{background:#fbe3df;color:var(--late)}
.b-none{background:#f0ece5;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-size:14px;background:var(--brand);color:#fff;font-weight:600}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.small{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
input,select,textarea{font:inherit;color:inherit;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;width:100%}
label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--tab);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav .inner{display:flex;width:100%;max-width:560px}
nav button{flex:1;background:none;border:0;padding:10px 0 12px;font-size:11px;color:var(--muted);display:flex;
  flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--brand);font-weight:600}
nav .ico{font-size:18px;line-height:1}
.hidden{display:none!important}
.empty-state{text-align:center;color:var(--muted);font-size:13px;padding:28px 10px;line-height:1.7}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-size:14px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"›";display:inline-block;margin-right:8px;color:var(--brand);transition:.2s}
details[open] summary:before{transform:rotate(90deg)}
details p{font-size:13px;color:#4a423a;line-height:1.6;margin:8px 0 0}
.modal{position:fixed;inset:0;background:rgba(30,24,18,.45);display:flex;align-items:flex-end;z-index:40}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;
  border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 6px;font-size:17px}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv span:first-child{color:var(--muted);flex:0 0 auto}
.kv span:last-child{text-align:right;word-break:break-all}
canvas{width:100%;height:110px;display:block}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:rgba(35,28,22,.9);color:#fff;
  font-size:13px;padding:9px 14px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.task{display:flex;gap:12px;align-items:center}
.task .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dot-ok{background:var(--ok)} .dot-warn{background:var(--warn)} .dot-late{background:var(--late)} .dot-none{background:#cfc6ba}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;
  padding:8px 0;border-bottom:1px dashed var(--line)}
.list-item:last-child{border-bottom:0}
.link{color:var(--brand);font-size:12px;text-decoration:none}
.sect-title{font-size:13px;font-weight:600;margin:14px 0 6px}
.hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1 id="pageTitle">猫手册</h1>
  <span class="sub" id="pageSub">PawBook</span>
</header>
<main>
  <!-- 档案 -->
  <section id="view-cats">
    <div id="catsList"></div>
    <button class="btn ghost wide" style="margin-top:4px" onclick="openCatEditor()">＋ 添加一只猫</button>
    <div class="card" style="margin-top:16px">
      <div class="row" style="justify-content:space-between">
        <div>
          <div class="name" style="font-size:14px">摄像头</div>
          <div class="meta" id="camMeta">未设置</div>
        </div>
        <button class="btn small ghost" onclick="editCamera()">设置</button>
      </div>
      <button class="btn small wide" id="camBtn" style="margin-top:10px" onclick="openCamera()">打开摄像头</button>
    </div>
    <div class="card">
      <div class="name" style="font-size:14px">数据备份</div>
      <div class="meta">数据只存在这台设备里，换手机或清缓存会丢，记得偶尔导出。</div>
      <div class="grid2" style="margin-top:10px">
        <button class="btn small ghost" onclick="exportData()">导出 JSON</button>
        <button class="btn small ghost" onclick="document.getElementById('importFile').click()">导入 JSON</button>
      </div>
      <input type="file" id="importFile" accept="application/json" class="hidden" onchange="importData(this)">
    </div>
  </section>

  <!-- 日程 -->
  <section id="view-tasks" class="hidden">
    <div class="chips" id="taskFilters">
      <button class="chip on" data-f="all" onclick="setFilter('all')">全部</button>
      <button class="chip" data-f="late" onclick="setFilter('late')">已逾期</button>
      <button class="chip" data-f="week" onclick="setFilter('week')">7 天内</button>
      <button class="chip" data-f="none" onclick="setFilter('none')">未记录</button>
    </div>
    <div id="tasksList"></div>
    <button class="btn ghost wide" style="margin-top:4px" onclick="openTaskEditor()">＋ 自定义事项</button>
    <div class="card" style="margin-top:12px">
      <div class="name" style="font-size:14px">导出到手机日历</div>
      <div class="meta">生成 .ics 文件，用手机日历打开即可获得系统级提醒（完全免费、不需要服务器）。</div>
      <button class="btn small wide ghost" style="margin-top:10px" onclick="exportICS()">导出未来一年日程</button>
    </div>
  </section>

  <!-- 忌讳 -->
  <section id="view-wiki" class="hidden">
    <div class="card" style="padding:12px 14px">
      <div style="font-weight:600">当前最该防什么</div>
      <div class="meta" id="wikiBanner" style="margin-top:4px"></div>
    </div>
    <input id="wikiSearch" placeholder="搜：百合 / 线 / 蚊香 / 尿闭…" oninput="renderWiki()" style="margin-top:10px" />
    <div id="wikiChips" style="display:flex;gap:6px;overflow-x:auto;padding:10px 2px"></div>
    <div id="wikiList"></div>
  </section>

  <!-- 装备 -->
  <section id="view-gear" class="hidden">
    <div class="card" style="padding:12px 14px">
      <div class="row" style="justify-content:space-between;align-items:baseline">
        <div style="font-weight:600">装备清单</div>
        <div class="meta" id="gearSum"></div>
      </div>
      <div class="meta" id="gearHint" style="margin-top:6px"></div>
      <div style="display:flex;gap:16px;margin-top:10px;font-size:12px;color:#8b8177">
        <a id="gearSortToggle" style="cursor:pointer" onclick="toggleSortDone()"></a>
        <a id="gearHiddenToggle" style="cursor:pointer" onclick="toggleGearHidden()"></a>
      </div>
    </div>
    <div id="gearChips" style="display:flex;gap:6px;overflow-x:auto;padding:10px 2px"></div>
    <div id="gearList"></div>
    <button class="btn ghost small wide" style="margin-top:12px" onclick="openGearEditor()">＋ 加一件自己的</button>
  </section>
</main>

<nav>
  <div class="inner">
    <button id="tab-cats" class="on" onclick="switchTab('cats')"><span class="ico">🐾</span>档案</button>
    <button id="tab-tasks" onclick="switchTab('tasks')"><span class="ico">📅</span>日程</button>
    <button id="tab-wiki" onclick="switchTab('wiki')"><span class="ico">⚠️</span>忌讳</button>
    <button id="tab-gear" onclick="switchTab('gear')"><span class="ico">🧰</span>装备</button>
  </div>
</nav>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 数据层 ===================== */
const KEY = 'pawbook.v2';
const V1KEY = 'pawbook.v1';

const PRESETS = [
  { key:'deworm_in',  name:'体内驱虫', cycle:90,  icon:'💊' },
  { key:'deworm_out', name:'体外驱虫', cycle:30,  icon:'🧴' },
  { key:'vaccine',    name:'疫苗加强', cycle:365, icon:'💉' },
  { key:'weight',     name:'称体重',   cycle:30,  icon:'⚖️' },
  { key:'nail',       name:'剪指甲',   cycle:21,  icon:'✂️' },
  { key:'ear',        name:'洗耳朵',   cycle:14,  icon:'👂' },
  { key:'brush',      name:'梳毛',     cycle:3,   icon:'🪮' },
  { key:'teeth',      name:'刷牙',     cycle:3,   icon:'🪥' },
  { key:'litterbox',  name:'洗猫砂盆', cycle:7,   icon:'🧽' },
  { key:'litter',     name:'换猫砂',   cycle:14,  icon:'🧹' },
  { key:'checkup',    name:'体检',     cycle:365, icon:'🏥' },
];

const DEFAULT = { version:2, cats:[], tasks:[], camera:{name:'',url:''}, settings:{remindDays:3} };
let db = load();

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function today(){ const d=new Date(); return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-'); }
function addDays(iso, n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-'); }
function daysBetween(a,b){ if(!a||!b) return null; return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function fmt(s){ return s ? s.replaceAll('-','/') : '—'; }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return Object.assign(structuredClone(DEFAULT), JSON.parse(raw));
    const old = localStorage.getItem(V1KEY);
    if(old) return migrate(JSON.parse(old));
  }catch(e){}
  return structuredClone(DEFAULT);
}
function migrate(v1){
  const d = structuredClone(DEFAULT);
  (v1.cats||[]).forEach(c=>{
    d.cats.push({
      id:c.id||uid(), name:c.name||'', nickname:'', breed:c.breed||'', sex:c.sex||'', color:'',
      birthday:c.birthday||'', homeDate:'', neutered:'', neuterDate:'', chip:'',
      weight:c.weight||'', weights: c.weight ? [{d:today(), kg:Number(c.weight)||0}] : [],
      photo:c.photo||'', food:'', litter:'', vet:'', vetPhone:'', insurance:'',
      allergies:'', history:'', notes:c.notes||'', vaccines:[]
    });
    PRESETS.forEach(p=>{
      let last = '';
      if(p.key==='deworm_in')  last = c.deworm?.inner?.date || '';
      if(p.key==='deworm_out') last = c.deworm?.outer?.date || '';
      d.tasks.push(mkTask(c.id, p.key, p.name, p.cycle, last, p.icon));
    });
  });
  d.camera = v1.camera || d.camera;
  d.settings = v1.settings || d.settings;
  return d;
}
function mkTask(catId, key, name, cycle, lastDate, icon){
  return { id:uid(), catId:catId||'', key:key||'custom', name, icon:icon||'📌',
           cycleDays:cycle, lastDate:lastDate||'', remindDays:3, note:'' };
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }
function catName(id){ const c = db.cats.find(x=>x.id===id); return c ? c.name : '全部'; }

/* ===================== 状态计算 ===================== */
function taskStatus(t){
  const remind = Number(t.remindDays ?? db.settings.remindDays ?? 3);
  if(!t.lastDate) return { state:'none', label:'未记录', left:null, due:null };
  const due = addDays(t.lastDate, Number(t.cycleDays)||30);
  const left = daysBetween(today(), due);
  if(left < 0) return { state:'late', label:`逾期 ${-left} 天`, left, due };
  if(left <= remind) return { state:'warn', label:`还有 ${left} 天`, left, due };
  return { state:'ok', label:`还有 ${left} 天`, left, due };
}

/* ===================== 渲染：档案 ===================== */
function switchTab(name){
  ['cats','tasks','wiki','gear'].forEach(k=>{
    document.getElementById('view-'+k).classList.toggle('hidden', k!==name);
    document.getElementById('tab-'+k).classList.toggle('on', k===name);
  });
  const titles = { cats:['猫手册','PawBook'], tasks:['日程','周期任务与提醒'], wiki:['忌讳','这些别让它碰到'], gear:['装备','买什么 / 不用买'] };
  document.getElementById('pageTitle').textContent = titles[name][0];
  document.getElementById('pageSub').textContent = titles[name][1];
  if(name==='tasks') renderTasks();
  if(name==='wiki') renderWiki();
  if(name==='gear') renderGear();
}

function catCard(cat){
  const mine = db.tasks.filter(t=>t.catId===cat.id).map(t=>({t, s:taskStatus(t)}));
  mine.sort((a,b)=>{
    const w = x => x.s.state==='late'?0:x.s.state==='warn'?1:x.s.state==='none'?2:3;
    return w(a)-w(b) || ((a.s.left??999)-(b.s.left??999));
  });
  const top = mine.slice(0,2).map(({t,s})=>`<span class="badge b-${s.state}">${t.icon||''}${esc(t.name)} · ${s.label}</span>`).join('');
  const ageM = cat.birthday ? Math.floor(daysBetween(cat.birthday, today())/30.4) : null;
  const photo = cat.photo ? `<img class="cat-photo" src="${cat.photo}" alt="">` : `<div class="cat-photo empty">🐱</div>`;
  const meta = [cat.breed, cat.color, cat.sex==='m'?'公':cat.sex==='f'?'母':'', ageM!=null?ageM+' 个月':'', cat.weight?cat.weight+' kg':'']
    .filter(Boolean).join(' · ') || '点开补充资料';
  return `<div class="card" onclick="openCatDetail('${cat.id}')">
    <div class="row">${photo}
      <div style="flex:1;min-width:0">
        <div class="name">${esc(cat.name)}${cat.nickname?` <span class="meta">（${esc(cat.nickname)}）</span>`:''}</div>
        <div class="meta">${esc(meta)}</div>
      </div>
    </div>
    <div style="margin-top:10px">${top || '<span class="badge b-none">还没有安排事项</span>'}</div>
  </div>`;
}

function renderCats(){
  const el = document.getElementById('catsList');
  el.innerHTML = db.cats.length
    ? db.cats.map(catCard).join('')
    : `<div class="card empty-state">还没有建档的猫猫<br>点下面的按钮加一只 🐈</div>`;
  const cam = db.camera;
  document.getElementById('camMeta').textContent = cam.url ? `${cam.name||'摄像头'} · 已设置` : '未设置';
  document.getElementById('camBtn').disabled = !cam.url;
  document.getElementById('camBtn').style.opacity = cam.url ? 1 : .45;
}

/* ===================== 渲染：日程 ===================== */
let taskFilter = 'all';
function setFilter(f){
  taskFilter = f;
  document.querySelectorAll('#taskFilters .chip').forEach(c=>c.classList.toggle('on', c.dataset.f===f));
  renderTasks();
}

function catsMissingPresets(){
  return db.cats.filter(c=>{
    const have = db.tasks.filter(t=>t.catId===c.id).map(t=>t.key);
    return PRESETS.some(p=>!have.includes(p.key));
  });
}
function fillPresets(){
  catsMissingPresets().forEach(c=>{
    const have = db.tasks.filter(t=>t.catId===c.id).map(t=>t.key);
    PRESETS.forEach(p=>{ if(!have.includes(p.key)) db.tasks.push(mkTask(c.id, p.key, p.name, p.cycle, '', p.icon)); });
  });
  save(); renderTasks(); renderCats(); toast('已补齐默认日程');
}

function renderTasks(){
  let rows = db.tasks.map(t=>({t, s:taskStatus(t)}));
  if(taskFilter==='late') rows = rows.filter(r=>r.s.state==='late');
  if(taskFilter==='none') rows = rows.filter(r=>r.s.state==='none');
  if(taskFilter==='week') rows = rows.filter(r=>r.s.left!==null && r.s.left<=7);
  rows.sort((a,b)=>{
    const w = x => x.s.state==='late'?0:x.s.state==='warn'?1:x.s.state==='none'?2:3;
    return w(a)-w(b) || ((a.s.left??999)-(b.s.left??999));
  });

  const el = document.getElementById('tasksList');
  if(!db.tasks.length){
    el.innerHTML = `<div class="card empty-state">还没有事项<br>加猫时会给一份默认清单，也可以自己加</div>`;
    return;
  }
  const lacking = catsMissingPresets();
  const fixCard = lacking.length
    ? `<div class="card"><div class="meta">${lacking.map(c=>esc(c.name)).join('、')} 还没有完整默认日程</div>
         <button class="btn small ghost wide" style="margin-top:8px" onclick="fillPresets()">补齐默认日程（${PRESETS.length} 项）</button></div>`
    : '';
  el.innerHTML = fixCard + (rows.map(({t,s})=>`
    <div class="card">
      <div class="task">
        <div class="dot dot-${s.state}"></div>
        <div style="flex:1;min-width:0">
          <div class="name" style="font-size:15px">${t.icon||''} ${esc(t.name)}</div>
          <div class="meta">${esc(catName(t.catId))} · 每 ${t.cycleDays} 天${t.lastDate?` · 上次 ${fmt(t.lastDate)}`:' · 还没做过'} · ${s.label}${s.due?`（下次 ${fmt(s.due)}）`:''}</div>
        </div>
      </div>
      <div class="grid2" style="margin-top:10px">
        <button class="btn small" onclick="event.stopPropagation();completeTask('${t.id}')">今天做了</button>
        <button class="btn small ghost" onclick="event.stopPropagation();openTaskEditor('${t.id}')">调整</button>
      </div>
    </div>`).join('') || `<div class="card empty-state">这个筛选下没有事项</div>`);
}

function completeTask(id){
  const t = db.tasks.find(x=>x.id===id); if(!t) return;
  t.lastDate = today(); save(); renderTasks(); renderCats(); toast('已记录今天');
}

/* ===================== 编辑器：猫 ===================== */
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function openCatEditor(id){
  const isNew = !id;
  const c = id ? db.cats.find(x=>x.id===id)
    : { id:uid(), name:'', nickname:'', breed:'', sex:'', color:'', birthday:'', homeDate:'', neutered:'',
        neuterDate:'', chip:'', weight:'', weights:[], photo:'', food:'', litter:'', vet:'', vetPhone:'',
        insurance:'', allergies:'', history:'', notes:'', vaccines:[] };
  const photo = c.photo || '';
  const opt = (v,label,cur)=>`<option value="${v}" ${cur===v?'selected':''}>${label}</option>`;
  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="sheet">
      <h2>${isNew?'添加猫猫':'编辑资料'}</h2>

      <div class="row" style="margin:12px 0;gap:14px">
        <div id="photoBox" style="width:72px;height:72px;border-radius:16px;overflow:hidden;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:28px">
          ${photo?`<img src="${photo}" style="width:100%;height:100%;object-fit:cover">`:'🐱'}
        </div>
        <div style="flex:1"><button class="btn small ghost" onclick="document.getElementById('photoFile').click()">选择照片</button>
          <input type="file" id="photoFile" accept="image/*" class="hidden" onchange="pickPhoto(this)"></div>
      </div>

      <div class="sect-title">基本信息</div>
      <div class="grid2">
        <div><label>名字</label><input id="f_name" value="${esc(c.name)}" placeholder="毛豆"></div>

function pickPhoto(input){
  const f = input.files[0]; if(!f) return;
  const img = new Image(), rd = new FileReader();
  rd.onload = e => {
    img.onload = () => {
      const max=640, k=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const data=cv.toDataURL('image/jpeg',.82);
      window.__photo=data;
      document.getElementById('photoBox').innerHTML=`<img src="${data}" style="width:100%;height:100%;object-fit:cover">`;
    };
    img.src=e.target.result;
  };
  rd.readAsDataURL(f);
}

function saveCat(id, isNew){
  const val = k => { const el=document.getElementById(k); return el ? el.value.trim() : ''; };
  const name = val('f_name');
  if(!name){ toast('至少写个名字'); return; }
  const base = {
    id, name, nickname:val('f_nickname'), breed:val('f_breed'), color:val('f_color'),
    sex:val('f_sex'), birthday:val('f_birthday'), homeDate:val('f_homeDate'),
    weight:val('f_weight'), neutered:val('f_neutered'), neuterDate:val('f_neuterDate'),
    chip:val('f_chip'), food:val('f_food'), litter:val('f_litter'), vet:val('f_vet'),
    vetPhone:val('f_vetPhone'), insurance:val('f_insurance'), allergies:val('f_allergies'),
    history:val('f_history'), notes:val('f_notes'), photo: window.__photo || ''
  };
  const i = db.cats.findIndex(x=>x.id===id);
  if(i>=0){
    db.cats[i] = Object.assign(db.cats[i], base);
  }else{
    db.cats.unshift(Object.assign({ weights:[], vaccines:[] }, base));
    PRESETS.forEach(p=> db.tasks.push(mkTask(id, p.key, p.name, p.cycle, '', p.icon)));
  }
  save(); closeModal(); renderCats(); renderTasks(); toast(isNew?'已添加（含默认日程）':'已保存');
}

function deleteCat(id){
  if(!confirm('删除这只猫和它的全部日程？')) return;
  db.cats = db.cats.filter(x=>x.id!==id);
  db.tasks = db.tasks.filter(t=>t.catId!==id);
  save(); closeModal(); renderCats(); renderTasks();
}

function addWeight(catId){
  const c = db.cats.find(x=>x.id===catId); if(!c) return;
  const kgEl = document.getElementById('w_kg');
  const dateEl = document.getElementById('w_date');
  const kg = Number(kgEl ? kgEl.value : 0);
  if(!kg || kg<=0 || kg>30){ toast('填个体重（0–30 kg）'); return; }
  const d = (dateEl && dateEl.value) ? dateEl.value : today();
  c.weights = c.weights || [];
  c.weights.push({ d, kg });
  c.weights.sort((a,b)=> a.d < b.d ? -1 : 1);
  c.weight = String(c.weights[c.weights.length-1].kg);
  const wt = db.tasks.find(t=>t.catId===catId && t.key==='weight');
  if(wt && d === today()) wt.lastDate = today();
  save(); toast('已记录'); openCatDetail(catId); renderCats();
}

function addVaccine(catId){
  const c = db.cats.find(x=>x.id===catId); if(!c) return;
  const name = document.getElementById('v_name').value.trim();
  const date = document.getElementById('v_date').value || today();
  c.vaccines = c.vaccines || [];
  c.vaccines.push({ name: name||'疫苗', date, next: addDays(date, 365) });
  const vt = db.tasks.find(t=>t.catId===catId && t.key==='vaccine');
  if(vt) vt.lastDate = date;
  save(); toast('已添加'); openCatDetail(catId);
}
function delVaccine(catId, i){
  const c = db.cats.find(x=>x.id===catId); if(!c) return;
  c.vaccines.splice(i,1); save(); openCatDetail(catId);
}

/* ===== 体重区间的品种参考（仅参考，不是诊断标准） ===== */
const BREED_TABLE = [
  { re:/布偶/,                          name:'布偶',   male:[5.5,8],   female:[4,6]   },
  { re:/缅因/,                          name:'缅因',   male:[6,9],     female:[4.5,6.5] },
  { re:/英短|蓝白|蓝猫|金渐层|银渐层/,  name:'英短',   male:[4,6.5],   female:[3,4.5] },
  { re:/美短|起司/,                     name:'美短',   male:[4,6],     female:[3,4.5] },
  { re:/拿破仑|曼基康|小短腿|矮脚/,     name:'拿破仑', male:[3,4.5],   female:[2.5,3.5] },
  { re:/加菲|异短|波斯|扁脸/,           name:'扁脸系', male:[3.5,5.5], female:[3,4.5] },
  { re:/暹罗|重点色/,                   name:'暹罗',   male:[4,5.5],   female:[3,4]   },
  { re:/田园|橘|狸花|三花|玳瑁|奶牛|狮子猫/, name:'中华田园', male:[4,6], female:[3,4.5] }
];
const KITTEN_GROWTH = [[0,0.05],[1,0.13],[2,0.25],[3,0.35],[4,0.45],[5,0.55],[6,0.65],[9,0.8],[12,0.95],[18,1]];
function kittenFactor(m){
  if(m === null || m >= 18) return 1;
  if(m <= 0) return 0.05;
  for(let i=1;i<KITTEN_GROWTH.length;i++){
    const a = KITTEN_GROWTH[i-1], b = KITTEN_GROWTH[i];
    if(m <= b[0]){ const t = (m - a[0]) / (b[0] - a[0]); return a[1] + (b[1]-a[1]) * t; }
  }
  return 1;
}
function ageMonthsOf(birth){
  if(!birth) return null;
  const d = new Date(birth); if(isNaN(d.getTime())) return null;
  const n = new Date();
  let m = (n.getFullYear()-d.getFullYear())*12 + (n.getMonth()-d.getMonth());
  if(n.getDate() < d.getDate()) m -= 1;
  return Math.max(0, m);
}
function suggestBand(cat){
  const txt = (cat.breed || '') + ' ' + (cat.color || '');
  const hit = BREED_TABLE.find(b => b.re.test(txt)) || BREED_TABLE[BREED_TABLE.length-1];
  const sex = cat.sex === 'm' ? 'male' : cat.sex === 'f' ? 'female' : 'mix';
  const adult = sex === 'male' ? hit.male
              : sex === 'female' ? hit.female
              : [ (hit.male[0]+hit.female[0])/2, (hit.male[1]+hit.female[1])/2 ];
  const m = ageMonthsOf(cat.birthday);
  const f = kittenFactor(m);
  const lo = Number((adult[0]*f).toFixed(1));
  let hi = Number((adult[1]*f).toFixed(1));
  if(hi <= lo) hi = Number((lo + 0.2).toFixed(1));
  return {
    lo, hi, breed: hit.name,
    sexTxt: cat.sex === 'm' ? '公' : cat.sex === 'f' ? '母' : '性别未知',
    ageTxt: m === null ? '年龄未知' : (m < 18 ? m + ' 个月' : '成猫'),
    hasAge: m !== null
  };
}
function useSuggestedBand(catId){
  const c = db.cats.find(x=>x.id===catId); if(!c) return;
  const s = suggestBand(c);
  c.wBand = { lo:s.lo, hi:s.hi };
  save(); toast(`已套用 ${s.lo}–${s.hi} kg`); openCatDetail(catId);
}

function weightPanel(cat){
  const list = (cat.weights||[]).slice().sort((a,b)=> a.d < b.d ? -1 : 1);
  const cur  = list.length ? list[list.length-1] : null;
  const prev = list.length > 1 ? list[list.length-2] : null;
  const delta = (cur && prev) ? Number((cur.kg - prev.kg).toFixed(2)) : null;
  const total = list.length > 1 ? Number((list[list.length-1].kg - list[0].kg).toFixed(2)) : null;
  const days  = list.length > 1 ? daysBetween(list[0].d, list[list.length-1].d) : 0;
  const dir = d => d > 0 ? '↑' : d < 0 ? '↓' : '→';

  const bandRaw = cat.wBand || null;
  const band = (bandRaw && isFinite(bandRaw.lo) && isFinite(bandRaw.hi))
    ? { lo:Math.min(Number(bandRaw.lo),Number(bandRaw.hi)), hi:Math.max(Number(bandRaw.lo),Number(bandRaw.hi)) }
    : null;
  let bandState = '';
  if(band && cur){
    const over = Number((cur.kg - band.hi).toFixed(2));
    const under = Number((band.lo - cur.kg).toFixed(2));
    bandState = (cur.kg > band.hi) ? `<div class="badge b-warn" style="margin-top:4px">高于上限 ${over} kg</div>`
      : (cur.kg < band.lo) ? `<div class="badge b-warn" style="margin-top:4px">低于下限 ${under} kg</div>`
      : `<div class="badge b-ok" style="margin-top:4px">在目标区间内</div>`;
  }

  const head = `
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div>
        <div style="font-size:24px;font-weight:700;line-height:1.1">${cur ? cur.kg + ' <span style="font-size:14px;font-weight:500;color:var(--muted)">kg</span>' : '<span style="font-size:15px;color:var(--muted)">还没有记录</span>'}</div>
        <div class="meta" style="margin-top:4px">${cur ? '最近一次 '+fmt(cur.d) : '记一次就会开始画曲线'}</div>
      </div>
      <div style="text-align:right">
        ${delta!==null ? `<div class="badge b-none">比上次 ${dir(delta)} ${Math.abs(delta).toFixed(2)} kg</div>` : ''}
        ${bandState}
        ${total!==null && days>0 ? `<div class="meta" style="margin-top:4px">${days} 天累计 ${dir(total)} ${Math.abs(total).toFixed(2)} kg</div>` : ''}
      </div>
    </div>`;

  let chart = '';
  if(list.length >= 2){
    const W=340, H=140, PL=8, PR=46, PT=14, PB=26;
    const kgs = list.map(x=>Number(x.kg));
    let lo = Math.min(...kgs), hi = Math.max(...kgs);
    if(band){ lo = Math.min(lo, band.lo); hi = Math.max(hi, band.hi); }
    if(hi - lo < 0.4){ const mid=(hi+lo)/2; lo=mid-0.2; hi=mid+0.2; }
    const pad = (hi-lo)*0.12; lo-=pad; hi+=pad;
    const x = i => PL + (list.length===1 ? (W-PL-PR)/2 : i*(W-PL-PR)/(list.length-1));
    const y = v => PT + (hi-v)/(hi-lo)*(H-PT-PB);

    const fmtY = v => (hi-lo > 0.6 ? v.toFixed(1) : v.toFixed(2));
    const grid = [hi, (hi+lo)/2, lo].map(v=>{
      const yy = y(v).toFixed(1);
      return `<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="#eee6da" stroke-width="1"/>
              <text x="${W-PR+6}" y="${Number(yy)+4}" font-size="10" fill="#8b8177">${fmtY(v)}</text>`;
    }).join('');

    const pts = list.map((p,i)=>`${x(i).toFixed(1)},${y(Number(p.kg)).toFixed(1)}`).join(' ');
    const dots = list.map((p,i)=>{
      const last = i===list.length-1;
      return `<circle cx="${x(i).toFixed(1)}" cy="${y(Number(p.kg)).toFixed(1)}" r="${last?4.5:2.8}"
                fill="${last?'#d97a4a':'#fff'}" stroke="#d97a4a" stroke-width="2"/>`;
    }).join('');

    const win = Math.min(7, list.length);
    const ma = list.map((_,i)=>{ const s=Math.max(0,i-win+1); let sum=0; for(let k=s;k<=i;k++) sum+=Number(list[k].kg); return sum/(i-s+1); });
    const maLine = (list.length>=4)
      ? `<polyline points="${ma.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none"
          stroke="#b0876a" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round" opacity="0.95"/>` : '';
    const bandRect = band ? (()=>{
      const yTop = y(band.hi), yBot = y(band.lo);
      const h = Math.max(0, yBot - yTop);
      return `<rect x="${PL}" y="${yTop.toFixed(1)}" width="${W-PL-PR}" height="${h.toFixed(1)}" fill="#d97a4a" opacity="0.09"/>
        <line x1="${PL}" y1="${yTop.toFixed(1)}" x2="${W-PR}" y2="${yTop.toFixed(1)}" stroke="#d97a4a" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
        <line x1="${PL}" y1="${yBot.toFixed(1)}" x2="${W-PR}" y2="${yBot.toFixed(1)}" stroke="#d97a4a" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
        <text x="${PL+3}" y="${(yTop-4).toFixed(1)}" font-size="9" fill="#b0876a">${band.lo}–${band.hi} kg</text>`;
    })() : '';

    chart = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;margin-top:10px">
      ${bandRect}
      ${grid}
      <polyline points="${pts}" fill="none" stroke="#d97a4a" stroke-width="2.5"
        stroke-linejoin="round" stroke-linecap="round"/>
      ${maLine}
      ${dots}
      <text x="${PL}" y="${H-6}" font-size="10" fill="#8b8177">${fmt(list[0].d)}</text>
      ${fmt(list[0].d)===fmt(list[list.length-1].d)?'':`<text x="${W-PR}" y="${H-6}" font-size="10" fill="#8b8177" text-anchor="end">${fmt(list[list.length-1].d)}</text>`}
    </svg>
    <div class="meta" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">
      <span>—— 实测</span>
      ${list.length>=4?`<span style="color:#b0876a">– – ${win} 次平均</span>`:''}
      ${band?`<span style="color:#b0876a">▮ 目标区间</span>`:''}
    </div>`;
  }else if(list.length === 1){
    chart = `<div class="hint" style="margin-top:10px">只有 1 条记录（${list[0].kg} kg · ${fmt(list[0].d)}），再记一次就能连成线。</div>`;
  }

  // 按月分组（新的在前），每组可折叠
  const byMonth = {};
  list.slice().reverse().forEach(r=>{
    const k = (r.d || '').slice(0,7);
    (byMonth[k] = byMonth[k] || []).push(r);
  });
  const months = Object.keys(byMonth);
  const rows = months.map((k, idx)=>{
    const arr = byMonth[k];
    const avg = (arr.reduce((a,b)=> a + Number(b.kg), 0) / arr.length).toFixed(2);
    const items = arr.map(r=>{
      const i = list.indexOf(r);
      return `<div class="list-item">
        <span>${fmt(r.d)} · <b>${r.kg}</b> kg</span>
        <a class="link" onclick="delWeight('${cat.id}',${i})">删除</a>
      </div>`;
    }).join('');
    const [y, m] = k.split('-');
    return `<details ${idx === 0 ? 'open' : ''} style="margin-top:8px">
      <summary style="cursor:pointer;font-size:13px;color:#6b6259;padding:4px 0">
        ${y} 年 ${Number(m)} 月 · ${arr.length} 次 · 均值 ${avg} kg
      </summary>
      ${items}
    </details>`;
  }).join('');

  return `<div class="card">
    ${head}
    ${chart}
    <div class="grid2" style="margin-top:12px">
      <input id="w_kg" type="number" step="0.01" placeholder="kg，如 4.25">
      <input id="w_date" type="date" value="${today()}">
    </div>
    <button class="btn small wide" style="margin-top:8px" onclick="addWeight('${cat.id}')">记录这笔</button>
    <div class="hint" style="margin-top:12px">目标区间：可手填，也可按品种/月龄取参考值</div>
    ${(()=>{ const s = suggestBand(cat); return `<div class="meta" style="margin-top:6px">
      参考：<b>${s.lo}–${s.hi} kg</b>（${s.breed} · ${s.sexTxt} · ${s.ageTxt}）
      <a class="link" style="margin-left:6px" onclick="useSuggestedBand('${cat.id}')">套用</a>
    </div>`; })()}
    <div class="grid2" style="margin-top:6px">
      <input id="b_lo" type="number" step="0.1" placeholder="下限 kg" value="${band?band.lo:''}">
      <input id="b_hi" type="number" step="0.1" placeholder="上限 kg" value="${band?band.hi:''}">
    </div>
    <button class="btn ghost small wide" style="margin-top:8px" onclick="saveWeightBand('${cat.id}')">保存区间</button>
    ${rows ? `<div style="margin-top:10px">${rows}</div>` : ''}
  </div>`;
}

function saveWeightBand(catId){
  const c = db.cats.find(x=>x.id===catId); if(!c) return;
  const lo = parseFloat(document.getElementById('b_lo').value);
  const hi = parseFloat(document.getElementById('b_hi').value);
  if(isFinite(lo) && isFinite(hi) && lo>0 && hi>0 && lo!==hi){ c.wBand = {lo,hi}; toast('区间已保存'); }
  else { delete c.wBand; toast('已清除区间'); }
  save(); openCatDetail(catId); renderCats();
}

function delWeight(catId, idx){
  const c = db.cats.find(x=>x.id===catId); if(!c || !c.weights) return;
  const list = c.weights.slice().sort((a,b)=> a.d < b.d ? -1 : 1);
  const target = list[idx];
  c.weights = c.weights.filter(w=> w !== target);
  c.weight = c.weights.length ? String(c.weights.slice().sort((a,b)=> a.d<b.d?-1:1).pop().kg) : '';
  save(); openCatDetail(catId); renderCats();
}

function saveTask(id, isNew){
  const v = k => document.getElementById(k).value;
  const name = v('t_name').trim();
  if(!name){ toast('写个名字'); return; }
  const data = { id, name, catId: v('t_cat'), icon: v('t_icon').trim()||'📌',
    cycleDays: Math.max(1, Number(v('t_cycle'))||30),
    remindDays: Math.max(0, Number(v('t_remind'))||3),
    lastDate: v('t_last'), note: v('t_note').trim() };
  const i = db.tasks.findIndex(x=>x.id===id);
  if(i>=0) db.tasks[i] = Object.assign(db.tasks[i], data);
  else db.tasks.push(Object.assign({ key:'custom' }, data));
  save(); closeModal(); renderTasks(); renderCats(); toast(isNew?'已添加':'已保存');

function deleteTask(id){
  if(!confirm('删除这个事项？')) return;
  db.tasks = db.tasks.filter(t=>t.id!==id);
  save(); closeModal(); renderTasks(); renderCats();
}

let gearCat = '必买';

function gearState(){
  if(!db.gear) db.gear = { custom:[], state:{} };
  if(!db.gear.state) db.gear.state = {};
  if(!Array.isArray(db.gear.custom)) db.gear.custom = [];
  return db.gear;
}
function gearAll(){
  const g = gearState();
  return GEAR.concat(g.custom.map(c=>({ ...c, custom:true })));
}
function toggleGear(id){
  const g = gearState();
  const cur = g.state[id] || {};
  cur.done = !cur.done;
  g.state[id] = cur;
  save(); renderGear();
}
function setGearPaid(id, v){
  const g = gearState();
  const cur = g.state[id] || {};
  cur.paid = v === '' ? null : Number(v);
  g.state[id] = cur;
  save(); renderGear();
}
function priceLo(p){
  const m = String(p||'').match(/(\d+)/);
  return m ? Number(m[1]) : 0;
}

function gearOrder(){
  const g = gearState();
  if(!Array.isArray(g.order)) g.order = [];
  return g.order;
}
let gearShowHidden = false;

function orderedGear(){
  const g = gearState();
  const order = gearOrder();
  const rows = gearAll().filter(x=> !(g.state[x.id]||{}).hidden);
  const pos = id => { const i = order.indexOf(id); return i < 0 ? 1e9 : i; };
  rows.sort((a,b)=> pos(a.id) - pos(b.id));
  if(g.sortDone !== false){
    rows.sort((a,b)=> (!!(g.state[a.id]||{}).done) - (!!(g.state[b.id]||{}).done));
  }
  return rows;
}
function moveGear(id, dir){
  const g = gearState();
  const vis = orderedGear().map(x=>x.id);
  const i = vis.indexOf(id), j = i + dir;
  if(i < 0 || j < 0 || j >= vis.length) return;
  [vis[i], vis[j]] = [vis[j], vis[i]];
  const rest = gearAll().map(x=>x.id).filter(x=> vis.indexOf(x) < 0);
  g.order = vis.concat(rest);
  save(); renderGear();
}
function removeGear(id){
  const g = gearState();
  const item = gearAll().find(x=>x.id===id);
  if(!item) return;
  if(!confirm('删除「' + item.t + '」？')) return;
  if(item.custom){
    g.custom = g.custom.filter(x=>x.id!==id);
    delete g.state[id];
  }else{
    g.state[id] = Object.assign({}, g.state[id]||{}, { hidden:true });
  }
  g.order = gearOrder().filter(x=> x!==id);
  save(); renderGear(); toast('已删除');
}
function restoreGear(id){
  const g = gearState();
  if(g.state[id]) delete g.state[id].hidden;
  save(); renderGear(); toast('已恢复');
}
function toggleSortDone(){
  const g = gearState();
  g.sortDone = !(g.sortDone !== false);
  save(); renderGear();
}
function toggleGearHidden(){
  gearShowHidden = !gearShowHidden;
  renderGear();
}

function renderGear(){
  const g = gearState();
  const all = gearAll();
  const visible = orderedGear();

  // 概览
  const sumEl = document.getElementById('gearSum');
  const hintEl = document.getElementById('gearHint');
  const must = all.filter(x=>x.cat==='必买');
  const doneMust = must.filter(x=> (g.state[x.id]||{}).done);
  const budget = all.filter(x=>x.cat!=='别买').reduce((a,x)=> a + priceLo(x.price), 0);
  const spent = Object.values(g.state).reduce((a,s)=> a + (Number(s.paid)||0), 0);
  if(sumEl) sumEl.innerHTML = `必买 <b>${doneMust.length}/${must.length}</b> · 参考预算约 ¥${budget} · 已花 ¥${spent}`;
  if(hintEl){
    const ages = db.cats.map(c=>ageMonthsOf(c.birthday)).filter(x=>x!==null);
    const y = ages.length ? Math.min(...ages) : null;
    hintEl.textContent = y !== null && y < 6
      ? `最小 ${y} 个月：先保证猫砂盆、幼猫粮、航空箱三件，其它可以慢慢添。`
      : '价格是常见区间，按你当地情况看；「别买」那栏是省钱的。';
  }

  const hiddenCount = all.filter(x=> (g.state[x.id]||{}).hidden).length;
  const sortEl = document.getElementById('gearSortToggle');
  if(sortEl) sortEl.textContent = (g.sortDone !== false ? '☑ ' : '☐ ') + '已买置底';
  const hidEl = document.getElementById('gearHiddenToggle');
  if(hidEl) hidEl.textContent = hiddenCount ? `已隐藏 ${hiddenCount} 项` : '';

  // 分类
  const cats = ['必买','推荐','别买','全部'];
  const chips = document.getElementById('gearChips');
  if(chips){
    chips.innerHTML = cats.map(c=>{
      const on = c === gearCat;
      return `<button onclick="gearCat='${c}';renderGear()" style="flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid ${on?'#d97a4a':'#e6ddd0'};background:${on?'#d97a4a':'#fff'};color:${on?'#fff':'#5c534a'};font-size:13px">${c}</button>`;
    }).join('');
  }

  const list = visible.filter(x=> gearCat === '全部' || x.cat === gearCat);
  let html = '';
  if(gearShowHidden && hiddenCount){
    const hid = all.filter(x=> (g.state[x.id]||{}).hidden);
    html += `<div class="card" style="padding:12px 14px;margin-top:8px">
      <div class="meta" style="margin-bottom:8px">已隐藏 ${hid.length} 项 · 点「恢复」放回清单</div>
      ${hid.map(x=>`<div class="list-item"><span>${esc(x.t)}</span>
        <a style="cursor:pointer;color:#d97a4a" onclick="restoreGear('${x.id}')">恢复</a></div>`).join('')}
    </div>`;
  }
  html += list.map(x=>{
    const st = g.state[x.id] || {};
    const done = !!st.done;
    const isNo = x.cat === '别买';
    return `<div class="card" style="padding:12px 14px;margin-top:8px">
      <div class="row" style="justify-content:space-between;align-items:flex-start;gap:10px">
        <div style="display:flex;gap:10px;align-items:flex-start">
          ${isNo ? `<span style="font-size:16px">🚫</span>`
                 : `<input type="checkbox" ${done?'checked':''} onchange="toggleGear('${x.id}')" style="width:20px;height:20px;margin-top:2px;accent-color:#d97a4a">`}
          <div>
            <div style="font-weight:600;${done?'text-decoration:line-through;color:#a59b90':''}">${esc(x.t)}${x.custom?' <span class="badge b-none">自定义</span>':''}</div>
            <div class="meta" style="margin-top:4px">${esc(x.note)}</div>
          </div>
        </div>
        <div style="text-align:right;flex:0 0 auto">
          <div class="meta">${esc(x.price)}</div>
          ${isNo ? '' : `<input type="number" inputmode="decimal" placeholder="实付" value="${st.paid ?? ''}"
            onchange="setGearPaid('${x.id}', this.value)"
            style="width:74px;margin-top:6px;font-size:13px;padding:4px 6px">`}
        </div>
      </div>
      <div style="display:flex;gap:18px;margin-top:10px;font-size:12.5px">
        <a style="cursor:pointer;color:#8b8177" onclick="moveGear('${x.id}',-1)">↑ 上移</a>
        <a style="cursor:pointer;color:#8b8177" onclick="moveGear('${x.id}',1)">↓ 下移</a>
        <a style="cursor:pointer;color:#c0584a" onclick="removeGear('${x.id}')">删除</a>
      </div>
    </div>`;
  }).join('') || `<div class="empty-state" style="margin-top:14px">这一类还没有东西</div>`;

  document.getElementById('gearList').innerHTML = html;
}

function openGearEditor(){
  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="sheet">
      <h2>加一件自己的</h2>
      <label>名称</label><input id="g_name" placeholder="比如 猫爬架 / 尿垫">
      <label>分类</label>

let wikiCat = '全部';

function renderWiki(){
  const q = (document.getElementById('wikiSearch').value || '').trim();
  const bannerEl = document.getElementById('wikiBanner');
  const chipsEl  = document.getElementById('wikiChips');

  // 月龄提示
  const ages = db.cats.map(c=>ageMonthsOf(c.birthday)).filter(x=>x !== null);
  const youngest = ages.length ? Math.min(...ages) : null;
  if(bannerEl){
    bannerEl.innerHTML = youngest === null
      ? '给猫填上「生日」，这里就会按它的月龄标出最该防的几项。'
      : (youngest < 6
        ? `有 <b>${youngest} 个月</b> 的小猫：标 ★ 的项目对它风险最高，先处理这些。`
        : `最小的猫已 <b>${youngest} 个月</b>，下面的急诊信号对成猫同样适用。`);
  }

  // 分类筛选
  const cats = ['全部', ...new Set(DANGER.map(d=>d.cat))];
  if(chipsEl){
    chipsEl.innerHTML = cats.map(c=>{
      const on = c === wikiCat;
      return `<button onclick="wikiCat='${c}';renderWiki()" style="flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid ${on?'#d97a4a':'#e6ddd0'};background:${on?'#d97a4a':'#fff'};color:${on?'#fff':'#5c534a'};font-size:13px">${c}</button>`;
    }).join('');
  }

  let list = DANGER.filter(d=> wikiCat === '全部' || d.cat === wikiCat);
  if(q) list = list.filter(d=> (d.t + d.why + d.todo).includes(q));

  const sevBadge = s => s === 3 ? '<span class="badge b-warn">致命 / 急诊</span>'
                  : s === 2 ? '<span class="badge b-none">高风险</span>'
                  : '<span class="badge b-ok">注意</span>';

  document.getElementById('wikiList').innerHTML = list.length
    ? list.map(d=>`<div class="card" style="padding:12px 14px;margin-top:8px">
        <div class="row" style="justify-content:space-between;align-items:baseline;gap:8px">
          <div style="font-weight:600">${esc(d.t)}${d.young?' <span style="color:#d97a4a">★</span>':''}</div>
          ${sevBadge(d.sev)}
        </div>
        <div class="meta" style="margin-top:6px">${esc(d.why)}</div>
        <div style="margin-top:6px;font-size:13px">👉 ${esc(d.todo)}</div>
      </div>`).join('')
    : `<div class="empty-state" style="margin-top:14px">没搜到，换个词试试</div>`;
}

/* ===================== 摄像头 ===================== */
function editCamera(){
  const cam = db.camera;
  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="sheet">
      <h2>摄像头</h2>
      <div class="hint">填一个手机浏览器能打开的画面地址：RTSP 需要先用 go2rtc / MediaMTX 转成网页可播的 WebRTC/HLS；也可以直接填厂商网页版地址。</div>
      <label>名称</label><input id="c_name" value="${esc(cam.name)}" placeholder="客厅 / 猫窝">
      <label>地址</label><input id="c_url" value="${esc(cam.url)}" placeholder="http://192.168.1.10:1984/stream.html">
      <div class="actions">
        <button class="btn ghost" onclick="closeModal()">取消</button>
        <button class="btn" onclick="saveCamera()">保存</button>
      </div>
    </div>
  </div>`;
}
function saveCamera(){
  db.camera = { name: document.getElementById('c_name').value.trim(), url: document.getElementById('c_url').value.trim() };
  save(); closeModal(); renderCats(); toast('已保存');
}
function openCamera(){
  if(!db.camera.url){ toast('先设置地址'); return; }
  window.open(db.camera.url,'_blank');
}

/* ===================== 备份 / 日历 ===================== */
function exportData(){
  const blob = new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`pawbook-${today()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!Array.isArray(d.cats)) throw 0;
      db=Object.assign(structuredClone(DEFAULT), d); save();
      renderCats(); renderTasks(); renderWiki(); toast('导入成功');
    }catch(err){ toast('导入失败：文件格式不对'); }
  };
  r.readAsText(f); input.value='';
}

function exportICS(){
  const stamp = s => s.replaceAll('-','');
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const dtstamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}T${pad(now.getHours())}${pad(now.getMinutes())}00`;
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PawBook//CN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'X-WR-CALNAME:猫手册提醒'
  ];
  let count = 0;
  db.tasks.forEach(t=>{
    if(!t.lastDate) return;
    const due = addDays(t.lastDate, Number(t.cycleDays)||30);
    for(let i=0;i<12;i++){   // 未来一年内的 12 次
      const d = addDays(due, i*(Number(t.cycleDays)||30));
      if(daysBetween(today(), d) > 365) break;
      const title = `${catName(t.catId)} · ${t.name}`;
      lines.push('BEGIN:VEVENT',
        `UID:${t.id}-${stamp(d)}@pawbook`,
        `DTSTAMP:${dtstamp}`,
        `DTSTART;VALUE=DATE:${stamp(d)}`,
        `SUMMARY:${escapeICS(title)}`,
        `DESCRIPTION:${escapeICS('来自猫手册 · 周期 '+(t.cycleDays||30)+' 天')}`,
        'BEGIN:VALARM','TRIGGER:-PT9H','ACTION:DISPLAY','DESCRIPTION:提醒','END:VALARM',
        'END:VEVENT');
      count++;
    }
  });
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='pawbook-提醒.ics'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(`导出了 ${count} 条日程`);
}
function escapeICS(s){ return String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'); }

/* ===================== 启动 ===================== */
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600);
}

renderCats(); renderTasks(); renderWiki();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
