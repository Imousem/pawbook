<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f0e8" />
<title>猫手册 · PawBook</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon.svg" />
<style>
:root{
  --bg:#f6f0e8; --card:#fffdfa; --ink:#2c2620; --muted:#8b8177;
  --line:#e9e0d4; --brand:#d97a4a; --brand-soft:#f7e3d5;
  --ok:#4f8a5b; --warn:#c98a1e; --late:#c0503f;
  --tab:#fffdfa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom));}
header{padding:18px 18px 10px;display:flex;align-items:baseline;gap:10px;max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0;letter-spacing:.5px}
.sub{font-size:12px;color:var(--muted)}
main{padding:0 14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;
  box-shadow:0 1px 0 rgba(0,0,0,.02)}
.row{display:flex;gap:12px;align-items:center}
.cat-photo{width:56px;height:56px;border-radius:14px;object-fit:cover;background:var(--brand-soft);flex:0 0 auto}
.cat-photo.empty{display:flex;align-items:center;justify-content:center;font-size:24px}
.name{font-size:16px;font-weight:600}
.meta{font-size:12px;color:var(--muted);margin-top:3px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-right:6px}
.b-ok{background:#e6f0e6;color:var(--ok)}
.b-warn{background:#fbf0d8;color:var(--warn)}
.b-late{background:#fbe3df;color:var(--late)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-size:14px;background:var(--brand);color:#fff;font-weight:600}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.small{padding:7px 11px;font-size:13px;border-radius:10px}
input,select,textarea{font:inherit;color:inherit;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;width:100%}
label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--tab);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav .inner{display:flex;width:100%;max-width:560px}
nav button{flex:1;background:none;border:0;padding:10px 0 12px;font-size:11px;color:var(--muted);display:flex;
  flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--brand);font-weight:600}
nav .ico{font-size:18px;line-height:1}
.hidden{display:none!important}
.empty-state{text-align:center;color:var(--muted);font-size:13px;padding:28px 10px}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-size:14px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"›";display:inline-block;margin-right:8px;color:var(--brand);transform:rotate(0);transition:.2s}
details[open] summary:before{transform:rotate(90deg)}
details p{font-size:13px;color:#4a423a;line-height:1.6;margin:8px 0 0}
.modal{position:fixed;inset:0;background:rgba(30,24,18,.45);display:flex;align-items:flex-end;z-index:40}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 6px;font-size:17px}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.wlist{font-size:13px;color:#4a423a}
.wrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
canvas{width:100%;height:110px;display:block}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:rgba(35,28,22,.9);color:#fff;
  font-size:13px;padding:9px 14px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1 id="pageTitle">猫手册</h1>
  <span class="sub" id="pageSub">PawBook</span>
</header>
<main>
  <!-- 档案页 -->
  <section id="view-cats">
    <div id="catsList"></div>
    <button class="btn ghost" style="width:100%;margin-top:4px" onclick="openCatEditor()">＋ 添加一只猫</button>
    <div class="card" style="margin-top:16px">
      <div class="row" style="justify-content:space-between">
        <div>
          <div class="name" style="font-size:14px">摄像头</div>
          <div class="meta" id="camMeta">未设置</div>
        </div>
        <button class="btn small ghost" onclick="editCamera()">设置</button>
      </div>
      <button class="btn small" id="camBtn" style="width:100%;margin-top:10px" onclick="openCamera()">打开摄像头</button>
    </div>
    <div class="card">
      <div class="name" style="font-size:14px">数据备份</div>
      <div class="meta">数据只存在这台设备里，换手机或清缓存会丢，记得偶尔导出。</div>
      <div class="grid2" style="margin-top:10px">
        <button class="btn small ghost" onclick="exportData()">导出 JSON</button>
        <button class="btn small ghost" onclick="document.getElementById('importFile').click()">导入 JSON</button>
      </div>
      <input type="file" id="importFile" accept="application/json" class="hidden" onchange="importData(this)">
    </div>
  </section>

  <!-- 提醒页 -->
  <section id="view-reminders" class="hidden">
    <div id="remindersList"></div>
  </section>

  <!-- 百科页 -->
  <section id="view-wiki" class="hidden">
    <input id="wikiSearch" placeholder="搜一下：驱虫、换粮、吐毛球…" oninput="renderWiki()" />
    <div class="card" style="margin-top:12px"><div id="wikiList"></div></div>
  </section>
</main>

<nav>
  <div class="inner">
    <button id="tab-cats" class="on" onclick="switchTab('cats')"><span class="ico">🐾</span>档案</button>
    <button id="tab-reminders" onclick="switchTab('reminders')"><span class="ico">💊</span>驱虫</button>
    <button id="tab-wiki" onclick="switchTab('wiki')"><span class="ico">📖</span>百科</button>
  </div>
</nav>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ========== 数据层 ========== */
const KEY = 'pawbook.v1';
const DEFAULT = { cats: [], camera: { name: '', url: '' }, settings: { remindDays: 3 } };
let db = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(DEFAULT);
    const d = JSON.parse(raw);
    return Object.assign(structuredClone(DEFAULT), d);
  }catch(e){ return structuredClone(DEFAULT); }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function today(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){ return s ? s.replaceAll('-','/') : '—'; }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }

/* 驱虫状态：返回 {state, due, left, label} */
function dewormStatus(cat, kind){
  const rec = cat.deworm?.[kind];
  if(!rec || !rec.date) return { state:'none', label:'未记录', left:null, due:null };
  const cycle = rec.cycle || (kind==='inner' ? 90 : 30);
  const due = new Date(rec.date); due.setDate(due.getDate()+cycle);
  const left = daysBetween(today(), due.toISOString().slice(0,10));
  const warn = db.settings.remindDays ?? 3;
  let state='ok', label='';
  if(left < 0){ state='late'; label=`已逾期 ${-left} 天`; }
  else if(left <= warn){ state='warn'; label=`还有 ${left} 天`; }
  else { state='ok'; label=`还有 ${left} 天`; }
  return { state, left, due: due.toISOString().slice(0,10), label,
           kindName: kind==='inner' ? '体内' : '体外', cycle };
}

/* ========== 渲染：档案 ========== */
function switchTab(name){
  ['cats','reminders','wiki'].forEach(k=>{
    document.getElementById('view-'+k).classList.toggle('hidden', k!==name);
    document.getElementById('tab-'+k).classList.toggle('on', k===name);
  });
  const titles = { cats:['猫手册','PawBook'], reminders:['驱虫提醒','到期与逾期'], wiki:['养猫百科','常见问题速查'] };
  document.getElementById('pageTitle').textContent = titles[name][0];
  document.getElementById('pageSub').textContent = titles[name][1];
  if(name==='reminders') renderReminders();
  if(name==='wiki') renderWiki();
}

function catCard(cat){
  const inner = dewormStatus(cat,'inner'), outer = dewormStatus(cat,'outer');
  const age = cat.birthday ? Math.floor(daysBetween(cat.birthday, today())/30.4) + ' 个月' : '';
  const photo = cat.photo
    ? `<img class="cat-photo" src="${cat.photo}" alt="">`
    : `<div class="cat-photo empty">🐱</div>`;
  return `<div class="card" onclick="openCatDetail('${cat.id}')">
    <div class="row">
      ${photo}
      <div style="flex:1;min-width:0">
        <div class="name">${esc(cat.name)} ${cat.sex==='m'?'♂':cat.sex==='f'?'♀':''}</div>
        <div class="meta">${[cat.breed, age, cat.weight? cat.weight+'kg':''].filter(Boolean).join(' · ') || '点开补充资料'}</div>
      </div>
    </div>
    <div style="margin-top:10px">
      <span class="badge b-${inner.state}">体内 · ${inner.label}</span>
      <span class="badge b-${outer.state}">体外 · ${outer.label}</span>
    </div>
  </div>`;
}

function renderCats(){
  const el = document.getElementById('catsList');
  if(!db.cats.length){
    el.innerHTML = `<div class="card empty-state">还没有建档的猫猫<br>点下面的按钮加一只 🐈</div>`;
  }else{
    el.innerHTML = db.cats.map(catCard).join('');
  }
  const cam = db.camera;
  document.getElementById('camMeta').textContent = cam.url ? `${cam.name || '摄像头'} · 已设置` : '未设置';
  document.getElementById('camBtn').disabled = !cam.url;
  document.getElementById('camBtn').style.opacity = cam.url ? 1 : .45;
}

/* ========== 渲染：提醒 ========== */
function renderReminders(){
  const rows = [];
  db.cats.forEach(cat=>{
    ['inner','outer'].forEach(k=>{
      const s = dewormStatus(cat,k);
      rows.push({ cat, kind:k, s });
    });
  });
  rows.sort((a,b)=>{
    const w = x => x.s.state==='late'?0:x.s.state==='warn'?1:x.s.state==='ok'?2:3;
    return w(a)-w(b) || (a.s.left??999)-(b.s.left??999);
  });
  const el = document.getElementById('remindersList');
  if(!db.cats.length){ el.innerHTML = `<div class="card empty-state">先添加猫猫，这里才有日程</div>`; return; }
  el.innerHTML = rows.map(r=>{
    const s=r.s, c=r.cat;
    const txt = s.state==='none' ? '还没记录过' :
      s.state==='late' ? `逾期 ${-s.left} 天（应 ${fmtDate(s.due)}）` :
      s.state==='warn' ? `${s.label}（${fmtDate(s.due)}）` : `下次 ${fmtDate(s.due)}`;
    return `<div class="card">
      <div class="row" style="justify-content:space-between">
        <div>
          <div class="name">${esc(c.name)} · ${s.kindName||(r.kind==='inner'?'体内':'体外')}驱虫</div>
          <div class="meta">${txt} · 周期 ${s.cycle||(r.kind==='inner'?90:30)} 天</div>
        </div>
        <button class="btn small" onclick="markDewormed('${c.id}','${r.kind}')">今天做了</button>
      </div>
    </div>`;
  }).join('');
}

function markDewormed(catId, kind){
  const cat = db.cats.find(c=>c.id===catId); if(!cat) return;
  cat.deworm = cat.deworm || {};
  cat.deworm[kind] = cat.deworm[kind] || { date:'', cycle: kind==='inner'?90:30 };
  cat.deworm[kind].date = today();
  save(); renderCats(); renderReminders(); toast('已记录今天');
}

/* ========== 渲染：百科 ========== */
const WIKI = [
  { t:'什么时候开始驱虫、多久一次', b:'幼猫一般 2 月龄开始：体内每 3 个月一次，体外每月一次（南方/草丛/多猫家庭可缩短）。成年室内猫也建议体内 3–6 个月、体外 1–3 个月。记录日期比记周期更重要。' },
  { t:'体内外驱虫能同时做吗', b:'多数复方药（滴剂）体内外同驱，可以同时；若用分开的药，错开 3–5 天更稳。驱虫前后 2 小时不洗澡，滴剂点在颈后皮肤、别让它舔到。' },
  { t:'换粮怎么过渡', b:'7 天过渡法：第 1–2 天新粮 25%，3–4 天 50%，5–6 天 75%，第 7 天全换。换快了容易软便；同时加益生菌。' },
  { t:'猫咪吐毛球正常吗', b:'偶尔吐毛球正常，每周超过 1 次或伴随精神食欲下降要就医。长毛猫每周梳 3–4 次，比吃化毛膏更有效。' },
  { t:'软便 / 拉稀怎么处理', b:'先看精神和食欲。精神好、能吃：禁食 6–8 小时（不禁水）+ 益生菌，观察 24 小时。带血、持续 2 天、伴呕吐或精神差 → 就医。' },
  { t:'猫咪应激（搬家、去医院、洗澡）', b:'提前 30–60 分钟用费洛蒙喷雾/插电，航空箱放件有它气味的衣服；不要强行抱出，让它自己出来。长途可咨询医生用加巴喷丁。' },
  { t:'公猫排尿困难 = 急症', b:'频繁进猫砂盆却尿不出、蹲很久、叫、舔生殖器 → 可能尿闭，24 小时内可致命，立刻就医。公猫尤其高发，别等。' },
  { t:'什么时候绝育', b:'一般 5–8 月龄、体重达标即可。术前禁食 8 小时（遵医嘱），术后戴伊丽莎白圈 7–10 天，观察伤口渗液与排尿。' },
  { t:'疫苗怎么打', b:'幼猫 2 月龄起打三联，间隔 3–4 周共 2–3 针；狂犬 3 月龄后 1 针。成年后每年加强一次（室内单猫可与医生讨论延长）。' },
  { t:'猫咪喝水量多少', b:'每公斤约 40–60 ml/天。3 kg 的猫约 150 ml。用流动水碗、湿粮、多点水碗能明显提升饮水量，减少泌尿问题。' },
  { t:'指甲、耳朵多久清理', b:'指甲 2–3 周剪一次（只剪透明的尖，避开血线）；耳朵 1–2 周看一眼，脏了用洗耳液擦外耳，不要棉签捅深。' },
  { t:'猫粮怎么挑（看配料表）', b:'前三位是具体肉源；幼猫粗蛋白 ≥38%、成猫 ≥32%；钙磷比 1.1–1.3；牛磺酸 ≥0.2%。预算有限时优先保证蛋白与肉源，配方表比广告词重要。' },
  { t:'家里有哪些致命危险', b:'百合（对猫剧毒，花粉也不行）、绿萝/万年青、灭鼠药、人用止痛药（布洛芬、对乙酰氨基酚）、线头与皮筋、洗衣机。' },
  { t:'多猫家庭怎么相处', b:'新猫先隔离 1–2 周，交换毛巾气味，再隔门喂食逐步见面。资源要 N+1（猫砂盆、食盆、水碗、猫爬架高点）。' },
];

function renderWiki(){
  const q = (document.getElementById('wikiSearch').value || '').trim();
  const list = q ? WIKI.filter(w => (w.t+w.b).includes(q)) : WIKI;
  document.getElementById('wikiList').innerHTML = list.length
    ? list.map(w=>`<details><summary>${esc(w.t)}</summary><p>${esc(w.b)}</p></details>`).join('')
    : `<div class="empty-state">没搜到，换个词试试</div>`;
}

/* ========== 编辑器 ========== */
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600);
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function openCatEditor(id){
  const c = id ? db.cats.find(x=>x.id===id) : { id:uid(), name:'', breed:'', sex:'', birthday:'', weight:'', photo:'', notes:'', deworm:{} };
  const isNew = !id;
  const photo = c.photo || '';
  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="sheet">
      <h2>${isNew?'添加猫猫':'编辑资料'}</h2>
      <div class="row" style="margin:12px 0;align-items:center;gap:14px">
        <div id="photoBox" style="width:72px;height:72px;border-radius:16px;overflow:hidden;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:28px">
          ${photo?`<img src="${photo}" style="width:100%;height:100%;object-fit:cover">`:'🐱'}
        </div>
        <div style="flex:1">
          <button class="btn small ghost" onclick="document.getElementById('photoFile').click()">选择照片</button>
          <input type="file" id="photoFile" accept="image/*" class="hidden" onchange="pickPhoto(this)">
        </div>
      </div>
      <label>名字</label><input id="f_name" value="${esc(c.name)}" placeholder="比如 毛豆">
      <div class="grid2">
        <div><label>品种</label><input id="f_breed" value="${esc(c.breed)}" placeholder="英短 / 拿破仑…"></div>
        <div><label>性别</label><select id="f_sex">
          <option value="" ${!c.sex?'selected':''}>未知</option>
          <option value="m" ${c.sex==='m'?'selected':''}>公</option>
          <option value="f" ${c.sex==='f'?'selected':''}>母</option>
        </select></div>
      </div>
      <div class="grid2">
        <div><label>生日</label><input id="f_birthday" type="date" value="${c.birthday||''}"></div>
        <div><label>体重(kg)</label><input id="f_weight" type="number" step="0.01" value="${c.weight||''}" placeholder="4.2"></div>
      </div>
      <label>备注（绝育、疫苗、过敏…）</label><textarea id="f_notes" rows="3">${esc(c.notes)}</textarea>
      <div class="actions">
        ${isNew?'':'<button class="btn ghost" style="flex:0 0 88px" onclick="deleteCat(\''+c.id+'\')">删除</button>'}
        <button class="btn ghost" onclick="closeModal()">取消</button>
        <button class="btn" onclick="saveCat('${c.id}', ${isNew}, '${photo?'1':'0'}')">保存</button>
      </div>
    </div>
  </div>`;
  window.__editingPhoto = photo;
}

function pickPhoto(input){
  const f = input.files[0]; if(!f) return;
  const img = new Image(); const reader = new FileReader();
  reader.onload = e => {
    img.onload = () => {
      const max = 640, scale = Math.min(1, max/Math.max(img.width,img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*scale); cv.height = Math.round(img.height*scale);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const data = cv.toDataURL('image/jpeg', .82);
      window.__editingPhoto = data;
      const box = document.getElementById('photoBox');
      box.innerHTML = `<img src="${data}" style="width:100%;height:100%;object-fit:cover">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(f);
}

function saveCat(id, isNew, hasPhoto){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('至少写个名字'); return; }
  const data = {
    id, name,
    breed: document.getElementById('f_breed').value.trim(),
    sex: document.getElementById('f_sex').value,
    birthday: document.getElementById('f_birthday').value,
    weight: document.getElementById('f_weight').value,
    notes: document.getElementById('f_notes').value.trim(),
    photo: window.__editingPhoto || '',
    deworm: (db.cats.find(x=>x.id===id)||{}).deworm || {}
  };
  const i = db.cats.findIndex(x=>x.id===id);
  if(i>=0) db.cats[i] = Object.assign(db.cats[i], data); else db.cats.unshift(data);
  save(); closeModal(); renderCats(); renderReminders(); toast(isNew?'已添加':'已保存');
}

function deleteCat(id){
  if(!confirm('删除这只猫的全部资料？')) return;
  db.cats = db.cats.filter(x=>x.id!==id); save(); closeModal(); renderCats(); renderReminders();
}

function openCatDetail(id){
  const c = db.cats.find(x=>x.id===id); if(!c) return;
  const inner = dewormStatus(c,'inner'), outer = dewormStatus(c,'outer');
  const age = c.birthday ? Math.floor(daysBetween(c.birthday, today())/30.4) : null;
  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="sheet">
      <div class="row" style="gap:14px">
        ${c.photo?`<img src="${c.photo}" style="width:76px;height:76px;border-radius:18px;object-fit:cover">`:`<div style="width:76px;height:76px;border-radius:18px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:30px">🐱</div>`}
        <div>
          <h2 style="margin:0">${esc(c.name)}</h2>
          <div class="meta">${[c.breed, c.sex==='m'?'公':c.sex==='f'?'母':'', age!=null?age+' 个月':'', c.birthday?fmtDate(c.birthday):''].filter(Boolean).join(' · ')}</div>
        </div>
      </div>
      ${c.notes?`<div class="card" style="margin-top:14px"><div class="meta" style="white-space:pre-wrap">${esc(c.notes)}</div></div>`:''}
      <div class="card" style="margin-top:12px">
        <div class="name" style="font-size:14px">驱虫</div>
        <div class="wlist" style="margin-top:8px">
          <div class="wrow"><span>体内 · 上次 ${fmtDate(c.deworm?.inner?.date)}</span><span class="badge b-${inner.state}">${inner.label}</span></div>
          <div class="wrow"><span>体外 · 上次 ${fmtDate(c.deworm?.outer?.date)}</span><span class="badge b-${outer.state}">${outer.label}</span></div>
        </div>
        <div class="grid2" style="margin-top:10px">
          <button class="btn small" onclick="markDewormed('${c.id}','inner');closeModal()">体内今天做了</button>
          <button class="btn small" onclick="markDewormed('${c.id}','outer');closeModal()">体外今天做了</button>
        </div>
      </div>
      <div class="actions">
        <button class="btn ghost" onclick="closeModal()">关闭</button>
        <button class="btn" onclick="closeModal();openCatEditor('${c.id}')">编辑资料</button>
      </div>
    </div>
  </div>`;
}

/* ========== 摄像头 ========== */
function editCamera(){
  const cam = db.camera;
  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="sheet">
      <h2>摄像头</h2>
      <div class="meta" style="margin-top:6px;line-height:1.6">填一个能在手机浏览器打开的画面地址：<br>
        · 支持 RTSP 的摄像头，先把 RTSP 转成网页可播的 HLS/WebRTC（需要一台常开的电脑）<br>
        · 或者直接填摄像头厂商的网页版地址 / 自建监控页</div>
      <label>名称</label><input id="c_name" value="${esc(cam.name)}" placeholder="客厅 / 猫窝">
      <label>地址</label><input id="c_url" value="${esc(cam.url)}" placeholder="http://192.168.1.10:8080/stream.html">
      <div class="actions">
        <button class="btn ghost" onclick="closeModal()">取消</button>
        <button class="btn" onclick="saveCamera()">保存</button>
      </div>
    </div>
  </div>`;
}
function saveCamera(){
  db.camera = { name: document.getElementById('c_name').value.trim(), url: document.getElementById('c_url').value.trim() };
  save(); closeModal(); renderCats(); toast('已保存');
}
function openCamera(){
  if(!db.camera.url){ toast('先设置地址'); return; }
  window.open(db.camera.url, '_blank');
}

/* ========== 备份 ========== */
function exportData(){
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pawbook-${today()}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function importData(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    try{
      const d = JSON.parse(e.target.result);
      if(!Array.isArray(d.cats)) throw new Error('格式不对');
      db = Object.assign(structuredClone(DEFAULT), d);
      save(); renderCats(); renderReminders(); renderWiki(); toast('导入成功');
    }catch(err){ toast('导入失败：文件格式不对'); }
  };
  r.readAsText(f);
  input.value = '';
}

/* ========== 启动 ========== */
renderCats(); renderWiki(); renderReminders();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
